<!-- tierlist.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TETLA_OS // TIER MAKER</title>
    
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:ital,wght@0,400;1,700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/tierlist.css">

    <link rel="stylesheet" href="css/modal/modal-layout.css"> 
    <link rel="stylesheet" href="css/modal/modal-sidebar.css"> 
    <link rel="stylesheet" href="css/modal/modal-typography.css"> 
    <link rel="stylesheet" href="css/modal/modal-animations.css"> 
    <link rel="stylesheet" href="css/modal/modal-posters.css"> 
    <link rel="stylesheet" href="css/modal/modal-player.css">
    <link rel="stylesheet" href="css/modal/modal-youtube.css">
</head>
<body>
    <div id="comet-system"></div>

    <!-- ОСНОВНАЯ ЗОНА ТИРЛИСТА (Будет скриншотиться) -->
    <main class="tier-board-wrapper">
        <div id="capture-zone" class="capture-container">
            <!-- Водяной знак для скриншота (виден только на PNG) -->
            <div class="watermark-export">TETLA_OS // TIER MAKER</div>
            
            <div class="tier-board" id="tier-board">
                <!-- Ряды генерируются через JS -->
            </div>
            
            <!-- Кнопка добавления ряда (скрывается при экспорте) -->
            <button id="btn-add-row" class="add-row-btn no-capture">
                <i class="fas fa-plus"></i> ДОБАВИТЬ КАТЕГОРИЮ
            </button>
        </div>
    </main>

    <!-- ПОДВАЛ С КАРТОЧКАМИ И УПРАВЛЕНИЕМ -->
    <footer class="tier-pool-wrapper">
        <div class="pool-header">
            
            <!-- Кнопки управления (Слева) -->
            <div class="pool-controls-group">
                <button id="btn-load-games" class="cyber-btn active"><i class="fas fa-gamepad"></i> ИГРЫ</button>
                <button id="btn-load-movies" class="cyber-btn"><i class="fas fa-film"></i> КИНО</button>
                <div class="divider"></div>
                <button id="btn-reset" class="cyber-btn danger" title="Сбросить"><i class="fas fa-trash"></i></button>
                <button id="btn-export-json" class="cyber-btn warning" title="Сохранить JSON"><i class="fas fa-file-code"></i></button>
                <button id="btn-export-png" class="cyber-btn success" title="Сохранить скриншот"><i class="fas fa-camera"></i> PNG</button>
            </div>
            
            <!-- Счетчик (По центру) -->
            <div class="pool-title">
                <span class="pool-counter" id="pool-counter">ОСТАЛОСЬ: 0</span>
            </div>
            
            <!-- Имбовый поисковик (Справа) -->
            <div class="search-module" id="search-module">
                <i class="fas fa-search search-icon" id="search-icon-default"></i>
                <input type="text" id="pool-search" placeholder="Поиск по базе..." autocomplete="off">
                <div class="search-hotkey" id="search-hotkey-hint">Ctrl+K</div>
                
                <!-- Выпадающий список поиска -->
                <div class="search-suggestions" id="search-suggestions"></div>
            </div>
            
        </div>
        
        <div class="tier-pool dropzone" id="tier-pool"></div>
    </footer>

    <!-- Библиотека для скриншотов -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script type="module" src="js/tierlist-app.js"></script>
</body>
</html>
